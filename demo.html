<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Pro - Zero Setup Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gradient-text {
            background: linear-gradient(to right, #2563eb, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [page, setPage] = useState('home');
            const [token, setToken] = useState(localStorage.getItem('token'));

            const navigate = (p) => setPage(p);

            if (page === 'home' && !token) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen">
                        <h1 className="text-6xl font-extrabold gradient-text mb-6">AI Resume Pro</h1>
                        <p className="text-xl text-slate-600 mb-8 max-w-2xl text-center px-4">
                            Automated Resume Analysis, ATS Scoring, and Job Matching.
                        </p>
                        <div className="flex gap-4">
                            <button onClick={() => navigate('login')} className="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg">Login</button>
                            <button onClick={() => navigate('signup')} className="px-8 py-3 bg-white text-blue-600 font-bold border border-blue-200 rounded-xl hover:bg-blue-50 transition">Sign Up</button>
                        </div>
                    </div>
                );
            }

            if (page === 'login') {
                return <Login onLogin={(t) => { setToken(t); setPage('dashboard'); }} onBack={() => setPage('home')} />;
            }

            if (page === 'signup') {
                return <Signup onDone={() => setPage('login')} onBack={() => setPage('home')} />;
            }

            return <Dashboard token={token} onLogout={() => { localStorage.removeItem('token'); setToken(null); setPage('home'); }} />;
        }

        function Login({ onLogin, onBack }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);
                try {
                    const res = await fetch('http://localhost:8000/auth/login', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.access_token) {
                        localStorage.setItem('token', data.access_token);
                        onLogin(data.access_token);
                    } else alert('Login failed');
                } catch (err) { alert('Backend not running? Ensure uvicorn is active.'); }
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4">
                    <div className="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
                        <h2 className="text-3xl font-bold gradient-text text-center mb-6">Welcome Back</h2>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="email" placeholder="Email" className="w-full p-3 border rounded-lg outline-none" value={email} onChange={e => setEmail(e.target.value)} required />
                            <input type="password" placeholder="Password" className="w-full p-3 border rounded-lg outline-none" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button className="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 tracking-wide shadow-lg">Login</button>
                        </form>
                        <button onClick={onBack} className="w-full mt-4 text-slate-500 font-medium">Back</button>
                    </div>
                </div>
            );
        }

        function Signup({ onDone, onBack }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');

            const handleSignup = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('http://localhost:8000/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, full_name: name })
                    });
                    if (res.ok) onDone(); else alert('Signup failed');
                } catch (err) { alert('Backend error'); }
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4">
                    <div className="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
                        <h2 className="text-3xl font-bold gradient-text text-center mb-6">Create Account</h2>
                        <form onSubmit={handleSignup} className="space-y-4">
                            <input type="text" placeholder="Full Name" className="w-full p-3 border rounded-lg" value={name} onChange={e => setName(e.target.value)} required />
                            <input type="email" placeholder="Email" className="w-full p-3 border rounded-lg" value={email} onChange={e => setEmail(e.target.value)} required />
                            <input type="password" placeholder="Password" className="w-full p-3 border rounded-lg" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button className="w-full py-3 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700 tracking-wide shadow-lg">Sign Up</button>
                        </form>
                        <button onClick={onBack} className="w-full mt-4 text-slate-500 font-medium">Back</button>
                    </div>
                </div>
            );
        }

        function Dashboard({ token, onLogout }) {
            return (
                <div className="flex min-h-screen bg-slate-50">
                    <div className="w-64 bg-white border-r p-6 flex flex-col items-center">
                        <h1 className="text-xl font-bold gradient-text mb-12">AI Resume Pro</h1>
                        <nav className="flex-1 space-y-4 w-full">
                            <button className="w-full text-left font-semibold p-3 bg-blue-50 text-blue-600 rounded-xl">Dashboard</button>
                            <p className="text-xs text-slate-400 p-2 italic text-center">Full version requires Node.js</p>
                        </nav>
                        <button onClick={onLogout} className="text-red-500 font-bold">Logout</button>
                    </div>
                    <main className="flex-1 p-12">
                        <h2 className="text-3xl font-bold mb-4">You're logged in!</h2>
                        <p className="text-slate-500">The zero-install demo is working. To access the full Resume Analyzer, Generator, and Job Recommender, please install <b>Node.js</b> and run "npm run dev".</p>

                        <div className="grid grid-cols-2 gap-8 mt-12">
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-lg mb-2">Backend Status</h3>
                                <p className="text-green-600 font-bold flex items-center gap-2">
                                    <span className="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                                    ONLINE (localhost:8000)
                                </p>
                            </div>
                            <div className="bg-blue-600 p-8 rounded-2xl shadow-xl text-white">
                                <h3 className="font-bold text-lg mb-2">Ready for Engineering Demo</h3>
                                <p className="opacity-80">This architecture demonstrates JWT security, SQLite persistence, and NLP-driven similarity matching.</p>
                            </div>
                        </div>
                    </main>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
